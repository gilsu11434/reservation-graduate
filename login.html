<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="창의융합프로젝트실 이메일 로그인 및 회원가입">
  <title>로그인 - 창의융합프로젝트실</title>
  <link rel="stylesheet" href="./styles/style.css?v=20260811-graduate-room-selection">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="./index.html" aria-label="학부실험실 홈">
        <span class="brand-mark" aria-hidden="true">융</span>
        <span class="brand-copy">
          <strong>학부실험실</strong>
          <small>Creative Project Room</small>
        </span>
      </a>

      <div class="auth-intro-copy">
        <h1>필요한 시간에<br>간편하게 예약하세요.</h1>
        <p>
          이메일로 로그인하고 예약부터 수료증 및 이용확인서 제출까지
          한곳에서 관리할 수 있습니다.
        </p>
      </div>

      <p class="auth-note">207관 605-1호 · 평일 10:00–18:00 운영</p>
    </section>

    <section class="auth-card" aria-label="계정 로그인 및 회원가입">
      <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
        <button
          class="auth-tab active"
          id="login-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="login-panel"
          data-auth-tab="login"
        >
          로그인
        </button>
        <button
          class="auth-tab"
          id="signup-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="signup-panel"
          data-auth-tab="signup"
        >
          회원가입
        </button>
      </div>

      <section
        class="auth-panel"
        id="login-panel"
        role="tabpanel"
        aria-labelledby="login-tab"
      >
        <h2>다시 만나서 반가워요</h2>
        <p>가입한 이메일과 비밀번호를 입력해 주세요.</p>

        <form id="login-form">
          <label class="field">
            이메일
            <input
              id="login-email"
              type="email"
              autocomplete="username"
              placeholder="가입한 이메일을 입력하세요"
              required
            >
          </label>

          <label class="field">
            비밀번호
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              placeholder="비밀번호를 입력하세요"
              required
            >
          </label>

          <button type="submit">로그인</button>
        </form>

        <p id="login-message" class="form-message" role="status"></p>
      </section>

      <section
        class="auth-panel"
        id="signup-panel"
        role="tabpanel"
        aria-labelledby="signup-tab"
        hidden
      >
        <h2>새 계정 만들기</h2>
        <p>기본 정보를 입력한 뒤 이메일 인증을 완료해 주세요.</p>

        <form id="signup-form">
          <div class="form-grid">
            <label class="field">
              이름
              <input id="signup-name" autocomplete="name" required>
            </label>

            <label class="field">
              학번
              <input
                id="signup-student-id"
                inputmode="numeric"
                autocomplete="username"
                required
              >
            </label>

            <label class="field">
              전화번호
              <input
                id="signup-phone"
                type="tel"
                autocomplete="tel"
                placeholder="010-0000-0000"
                required
              >
            </label>

            <label class="field">
              학과
              <input id="signup-department" value="전자전기공학부" required>
            </label>

            <label class="field field-full">
              이메일
              <input
                id="signup-email"
                type="email"
                autocomplete="email"
                placeholder="로그인에 사용할 이메일"
                required
              >
            </label>

            <label class="field">
              비밀번호
              <input
                id="signup-password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </label>

            <label class="field">
              비밀번호 확인
              <input
                id="signup-password-confirm"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >
            </label>
          </div>

          <button type="submit">회원가입 및 인증메일 받기</button>
        </form>

        <p id="signup-message" class="form-message" role="status"></p>
      </section>
    </section>
  </main>

  <script type="module" src="./scripts/auth.js?v=20260806-email-confirmation"></script>
</body>
</html>
